  - id: H06
    difficulty: hard
    seen_in_phase2: false
    request: >-
      When an object is created in an S3 bucket, a Python Lambda function writes
      the object key and size to a DynamoDB table (on-demand billing, string
      partition key named object_key). If an invocation still fails after its
      retries, the failed event goes to an SQS queue. The function's role may only
      put items into that table and send messages to that queue, plus write its
      own logs.
    expected_resources:
      aws_s3_bucket: 1
      aws_s3_bucket_notification: 1
      aws_lambda_function: 1
      aws_lambda_permission: 1
      aws_iam_role: 1
      aws_dynamodb_table: 1
      aws_sqs_queue: 1
    behaviours:
      - Uploading an object writes one item keyed by the object key.
      - A forced failure ends up as a message in the queue.
      - The role can PutItem on the table and SendMessage on the queue only.
    plan_checks:
      - id: notification_to_function
        type: aws_s3_bucket_notification
        references: {attr: lambda_function, to: aws_lambda_function}
      - id: s3_may_invoke
        type: aws_lambda_permission
        attrs: {principal: s3.amazonaws.com}
        references: {attr: source_arn, to: aws_s3_bucket}
      - id: role_scoped_to_table
        type: [aws_iam_role_policy, aws_iam_policy]
        references: {to: aws_dynamodb_table}
      - id: role_scoped_to_queue
        type: [aws_iam_role_policy, aws_iam_policy]
        references: {to: aws_sqs_queue}
      - id: failures_to_queue
        type: [aws_lambda_function, aws_lambda_function_event_invoke_config]
        references: {to: aws_sqs_queue}

  - id: H07
    difficulty: hard
    seen_in_phase2: false
    request: >-
      An SNS topic for order events that fans out to two SQS queues, billing and
      shipping. Each queue has its own dead-letter queue that receives messages
      after 5 failed receives. Each queue's access policy allows only that topic
      to send to it, and the subscriptions use raw message delivery.
    expected_resources:
      aws_sns_topic: 1
      aws_sqs_queue: 4
      aws_sns_topic_subscription: 2
      aws_sqs_queue_policy: 2
    behaviours:
      - Publishing once delivers the raw message body to both billing and shipping.
      - Each main queue redrives to its own dead-letter queue with maxReceiveCount 5.
    plan_checks:
      - id: raw_sqs_subscription
        type: aws_sns_topic_subscription
        attrs:
          protocol: sqs
          raw_message_delivery: true
        references: {attr: topic_arn, to: aws_sns_topic}
      - id: dlq_wired
        type: [aws_sqs_queue, aws_sqs_queue_redrive_policy]
        references: {attr: redrive_policy, to: aws_sqs_queue}
      - id: queue_policy_names_topic
        type: aws_sqs_queue_policy
        references: {attr: policy, to: aws_sns_topic}

