[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrapilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests~=2.34.2",
    "pyyaml~=6.0.3",
]

[project.scripts]
infrapilot = "infrapilot.cli:main"

[project.optional-dependencies]
dev = ["pytest~=9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "terraform: runs the real terraform binary (no AWS calls)",
    "aws: calls AWS with the read-only profile; free, creates nothing",
]

[tool.setuptools.packages.find]
include = ["infrapilot*"]

[tool.setuptools.package-data]
"infrapilot.generator" = ["*.txt"]
"infrapilot.runner" = ["templates/*.tf", "templates/.terraform.lock.hcl"]
