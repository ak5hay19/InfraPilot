[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrapilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests~=2.34.2",
    "pyyaml~=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest~=9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["infrapilot*"]
